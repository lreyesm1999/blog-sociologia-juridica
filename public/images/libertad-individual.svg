<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="skyLibre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#356B86"/>
      <stop offset="100%" stop-color="#F5F1E8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#skyLibre)"/>

  <!-- Sun -->
  <circle cx="980" cy="180" r="70" fill="#B58A4A" opacity="0.85"/>

  <!-- Path -->
  <path d="M0,760 C300,660 500,760 700,680 C900,600 1050,700 1200,650 L1200,800 L0,800 Z" fill="#356B86" opacity="0.35"/>

  <!-- Birds -->
  <g stroke="#17324D" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M150,150 q20,-20 40,0 q20,-20 40,0"/>
    <path d="M260,200 q16,-16 32,0 q16,-16 32,0"/>
  </g>

  <!-- Person walking -->
  <g fill="#17324D">
    <circle cx="600" cy="460" r="34"/>
    <path d="M600,494 L600,600 M600,520 L540,580 M600,520 L660,470 M600,600 L560,690 M600,600 L650,680" stroke="#17324D" stroke-width="18" stroke-linecap="round" fill="none"/>
  </g>

  <text x="600" y="760" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#17324D">Derecho, libertad e individuo</text>
</svg>
