<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)"/>
  <rect width="116" height="116" x="2" y="2" rx="26" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <!-- Soft Inner Glow -->
  <circle cx="60" cy="60" r="48" fill="url(#glowGrad)"/>
  
  <!-- Central Column (Law Pillar) -->
  <path d="M 60 26 L 60 88" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <!-- Top Capital & Base -->
  <path d="M 48 30 L 72 30" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 44 88 L 76 88" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Scale Beam (Balance) -->
  <path d="M 28 42 Q 60 36 92 42" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="60" cy="38" r="5" fill="url(#goldGrad)"/>

  <!-- Left Scale Pan (Society / People) -->
  <line x1="28" y1="42" x2="20" y2="64" stroke="url(#goldGrad)" stroke-width="1.75" opacity="0.8"/>
  <line x1="28" y1="42" x2="36" y2="64" stroke="url(#goldGrad)" stroke-width="1.75" opacity="0.8"/>
  <path d="M 16 64 Q 28 73 40 64 Z" fill="url(#goldGrad)"/>

  <!-- Right Scale Pan (Justice / Rights) -->
  <line x1="92" y1="42" x2="84" y2="64" stroke="url(#goldGrad)" stroke-width="1.75" opacity="0.8"/>
  <line x1="92" y1="42" x2="100" y2="64" stroke="url(#goldGrad)" stroke-width="1.75" opacity="0.8"/>
  <path d="M 80 64 Q 92 73 104 64 Z" fill="url(#goldGrad)"/>

  <!-- Stylized Open Book Foundation -->
  <path d="M 36 82 Q 60 76 84 82 L 84 86 Q 60 80 36 86 Z" fill="url(#goldGrad)" opacity="0.9"/>
</svg>
