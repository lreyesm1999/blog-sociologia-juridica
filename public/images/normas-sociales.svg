<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#F5F1E8"/>

  <!-- Four quadrants representing moral, costumbre, religion, derecho -->
  <g>
    <rect x="80" y="80" width="480" height="300" rx="18" fill="#17324D"/>
    <rect x="640" y="80" width="480" height="300" rx="18" fill="#356B86"/>
    <rect x="80" y="420" width="480" height="300" rx="18" fill="#B58A4A"/>
    <rect x="640" y="420" width="480" height="300" rx="18" fill="#17324D" opacity="0.8"/>
  </g>

  <!-- Moral: heart/conscience -->
  <g fill="#F5F1E8">
    <path d="M320,180 C300,150 240,150 240,205 C240,250 320,300 320,300 C320,300 400,250 400,205 C400,150 340,150 320,180 Z"/>
  </g>
  <text x="320" y="350" text-anchor="middle" font-family="Arial" font-size="24" fill="#F5F1E8">Moral</text>

  <!-- Costumbre: clock/repeat -->
  <g fill="none" stroke="#F5F1E8" stroke-width="12">
    <circle cx="880" cy="220" r="80"/>
  </g>
  <line x1="880" y1="220" x2="880" y2="170" stroke="#F5F1E8" stroke-width="10" stroke-linecap="round"/>
  <line x1="880" y1="220" x2="915" y2="235" stroke="#F5F1E8" stroke-width="10" stroke-linecap="round"/>
  <text x="880" y="350" text-anchor="middle" font-family="Arial" font-size="24" fill="#F5F1E8">Costumbre</text>

  <!-- Religion: simple arch/temple -->
  <g fill="#F5F1E8">
    <polygon points="320,500 260,560 380,560"/>
    <rect x="275" y="560" width="20" height="80"/>
    <rect x="320" y="560" width="20" height="80"/>
    <rect x="365" y="560" width="20" height="80"/>
    <rect x="255" y="640" width="130" height="16"/>
  </g>
  <text x="320" y="700" text-anchor="middle" font-family="Arial" font-size="24" fill="#F5F1E8">Religión</text>

  <!-- Derecho: gavel -->
  <g stroke="#F5F1E8" stroke-width="14" stroke-linecap="round">
    <line x1="840" y1="620" x2="930" y2="530"/>
    <line x1="860" y1="560" x2="910" y2="610"/>
  </g>
  <rect x="800" y="660" width="150" height="16" rx="6" fill="#F5F1E8"/>
  <text x="880" y="700" text-anchor="middle" font-family="Arial" font-size="24" fill="#F5F1E8">Derecho</text>
</svg>
