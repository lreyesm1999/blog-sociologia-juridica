<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#F5F1E8"/>
  <rect width="1200" height="800" fill="#17324D" opacity="0.03"/>

  <!-- Desk -->
  <rect x="0" y="620" width="1200" height="180" fill="#356B86" opacity="0.15"/>

  <!-- Stack of books -->
  <g>
    <rect x="330" y="560" width="300" height="40" rx="4" fill="#356B86"/>
    <rect x="350" y="510" width="280" height="40" rx="4" fill="#17324D"/>
    <rect x="320" y="460" width="300" height="40" rx="4" fill="#B58A4A"/>
    <rect x="360" y="410" width="240" height="40" rx="4" fill="#356B86"/>
  </g>

  <!-- Balanza -->
  <g stroke="#17324D" stroke-width="9" fill="none" stroke-linecap="round">
    <line x1="820" y1="230" x2="820" y2="400"/>
    <line x1="710" y1="270" x2="930" y2="270"/>
    <line x1="710" y1="270" x2="675" y2="345"/>
    <line x1="710" y1="270" x2="745" y2="345"/>
    <line x1="930" y1="270" x2="895" y2="345"/>
    <line x1="930" y1="270" x2="965" y2="345"/>
  </g>
  <g fill="#17324D">
    <circle cx="820" cy="230" r="10"/>
    <path d="M675,345 A35,35 0 0,0 745,345 Z"/>
    <path d="M895,345 A35,35 0 0,0 965,345 Z"/>
    <rect x="790" y="400" width="60" height="14" rx="4"/>
  </g>

  <!-- Magnifying glass over society icon -->
  <g>
    <circle cx="880" cy="560" r="70" fill="none" stroke="#B58A4A" stroke-width="12"/>
    <line x1="928" y1="608" x2="985" y2="665" stroke="#B58A4A" stroke-width="14" stroke-linecap="round"/>
    <circle cx="880" cy="560" r="18" fill="#356B86"/>
    <circle cx="860" cy="540" r="10" fill="#356B86"/>
    <circle cx="900" cy="540" r="10" fill="#356B86"/>
  </g>

  <text x="600" y="740" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#17324D">¿Qué estudia la sociología jurídica?</text>
</svg>
