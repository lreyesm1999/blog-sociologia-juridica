<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#F5F1E8"/>
  <rect x="0" y="600" width="1200" height="200" fill="#356B86" opacity="0.2"/>

  <!-- Rising bars representing transformation -->
  <g fill="#B58A4A">
    <rect x="820" y="520" width="70" height="130"/>
    <rect x="910" y="460" width="70" height="190"/>
    <rect x="1000" y="380" width="70" height="270"/>
  </g>
  <path d="M800,500 L1080,360" stroke="#17324D" stroke-width="8" fill="none" stroke-linecap="round"/>
  <polygon points="1080,360 1050,368 1072,392" fill="#17324D"/>

  <!-- Group of people (assembly) -->
  <g fill="#17324D">
    <circle cx="200" cy="560" r="30"/>
    <rect x="168" y="596" width="64" height="95" rx="18"/>
    <circle cx="320" cy="540" r="34"/>
    <rect x="284" y="580" width="72" height="110" rx="20"/>
    <circle cx="440" cy="560" r="28"/>
    <rect x="410" y="594" width="60" height="90" rx="16"/>
    <circle cx="560" cy="550" r="30"/>
    <rect x="528" y="586" width="64" height="95" rx="18"/>
  </g>

  <text x="600" y="760" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#17324D">¿Puede el derecho transformar la sociedad?</text>
</svg>
