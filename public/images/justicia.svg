<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#17324D"/>

  <!-- Steps -->
  <g fill="#0f2436">
    <rect x="200" y="700" width="800" height="30"/>
    <rect x="240" y="670" width="720" height="30"/>
    <rect x="280" y="640" width="640" height="30"/>
  </g>

  <!-- Columns -->
  <g fill="#F5F1E8">
    <rect x="320" y="380" width="30" height="260"/>
    <rect x="410" y="380" width="30" height="260"/>
    <rect x="500" y="380" width="30" height="260"/>
    <rect x="670" y="380" width="30" height="260"/>
    <rect x="760" y="380" width="30" height="260"/>
    <rect x="850" y="380" width="30" height="260"/>
    <polygon points="300,380 600,260 900,380"/>
    <rect x="290" y="360" width="620" height="26"/>
  </g>

  <!-- Balanza grande -->
  <g stroke="#B58A4A" stroke-width="12" fill="none" stroke-linecap="round">
    <line x1="600" y1="120" x2="600" y2="330"/>
    <line x1="450" y1="180" x2="750" y2="180"/>
    <line x1="450" y1="180" x2="400" y2="280"/>
    <line x1="450" y1="180" x2="500" y2="280"/>
    <line x1="750" y1="180" x2="700" y2="280"/>
    <line x1="750" y1="180" x2="800" y2="280"/>
  </g>
  <g fill="#B58A4A">
    <circle cx="600" cy="120" r="14"/>
    <path d="M400,280 A50,50 0 0,0 500,280 Z"/>
    <path d="M700,280 A50,50 0 0,0 800,280 Z"/>
    <rect x="560" y="330" width="80" height="16" rx="4"/>
  </g>

  <text x="600" y="760" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#F5F1E8">Bien común, justicia y seguridad jurídica</text>
</svg>
